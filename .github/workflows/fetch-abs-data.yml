name: Fetch ABS Data
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  fetch-abs-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ABS_API: "https://data.api.abs.gov.au/rest/data"
      USER_AGENT: "ABSVisFramework/1.0 (github-actions; open-source research)"
      CPI_DATAFLOW: "ABS,CPI"
      CPI_KEY: "1.10001.10.50.Q"
      CPIGROUPS_DATAFLOW: "ABS,CPI"
      CPIGROUPS_KEY: "1.10001+20001+20002+20003+20004+20005+20006+115486+115488+115489+115493+126670.10.50.Q"
      CPIHOUSING_DATAFLOW: "ABS,CPI"
      CPIHOUSING_KEY: "1.20003+30014+40053+40055+97558+97559+97560+115524.10.50.Q"
      AWE_DATAFLOW: "ABS,AWE"
      AWE_KEY: "3.1.3.7.TOT.10.AUS.S"
      LCI_DATAFLOW: "ABS,LCI"
      LCI_KEY: "1.10001.P1.50.Q"
      LCIGROUPS_DATAFLOW: "ABS,LCI"
      LCIGROUPS_KEY: "1.10001+20001+20002+20003+20004+20005+20006+115486+115488+115489+115493+126670+131278+131279.P1.50.Q"
      WPI_DATAFLOW: "ABS,WPI"
      WPI_KEY: "1.THRPEB.7.TOT.20.AUS.Q"
      POPULATION_DATAFLOW: "ABS,ERP_COMP_Q"
      POPULATION_KEY: "10.AUS.Q"
      GDP_DATAFLOW: "ABS,ANA_AGG"
      GDP_KEY: "M1.GPM.20.AUS.Q"
      HOUSEHOLDS_DATAFLOW: "ABS,ABS_HH_PROV"
      HOUSEHOLDS_KEY: "0.4.1.Q"
      BUILDING_ACTIVITY_DATAFLOW: "ABS,BUILDING_ACTIVITY"
      BUILDING_ACTIVITY_KEY: "M6.AUS.CUR.TOT.9.100.20.Q"
      LENDING_HOUSING_DATAFLOW: "ABS,LEND_HOUSING"
      LENDING_HOUSING_KEY: "FIN_NUM.NEWCOMMITS.DV8575.TOTLOANPURP.TOT.TOT.20.AUS.Q"
      LABOUR_ACCOUNT_DATAFLOW: "ABS,LABOUR_ACCT_Q"
      LABOUR_ACCOUNT_KEY: "20.Q.TOTAL.TOTAL.AUS"
      HOUSEHOLD_SPENDING_DATAFLOW: "ABS,HSI_Q"
      HOUSEHOLD_SPENDING_KEY: "4.TOT.CVM.20.AUS.Q"
      LABOUR_FORCE_DATAFLOW: "ABS,LF"
      LABOUR_FORCE_KEY: "M9.3.1599.20.AUS.Q"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create data directories
        run: |
          mkdir -p data/cpi data/cpigroups data/cpihousing data/awe data/lci data/lcigroups data/wpi data/population data/gdp data/households data/building_activity data/lending_housing data/labour_account data/household_spending data/labour_force

      - name: Fetch CPI CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$CPI_DATAFLOW/$CPI_KEY?detail=dataonly" \
            -o data/cpi/cpi.csv
          echo "CPI CSV rows: $(wc -l < data/cpi/cpi.csv)"

      - name: Fetch CPI JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$CPI_DATAFLOW/$CPI_KEY?detail=full" \
            -o data/cpi/cpi.json
          echo "CPI JSON: $(wc -c < data/cpi/cpi.json) bytes"

      - name: Fetch CPIgroups CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$CPIGROUPS_DATAFLOW/$CPIGROUPS_KEY?detail=dataonly" \
            -o data/cpigroups/cpigroups.csv
          echo "CPIgroups CSV rows: $(wc -l < data/cpigroups/cpigroups.csv)"

      - name: Fetch CPIgroups JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$CPIGROUPS_DATAFLOW/$CPIGROUPS_KEY?detail=full" \
            -o data/cpigroups/cpigroups.json
          echo "CPIgroups JSON: $(wc -c < data/cpigroups/cpigroups.json) bytes"

      - name: Fetch CPIhousing CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$CPIHOUSING_DATAFLOW/$CPIHOUSING_KEY?detail=dataonly" \
            -o data/cpihousing/cpihousing.csv
          echo "CPIhousing CSV rows: $(wc -l < data/cpihousing/cpihousing.csv)"

      - name: Fetch CPIhousing JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$CPIHOUSING_DATAFLOW/$CPIHOUSING_KEY?detail=full" \
            -o data/cpihousing/cpihousing.json
          echo "CPIhousing JSON: $(wc -c < data/cpihousing/cpihousing.json) bytes"

      - name: Fetch AWE CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$AWE_DATAFLOW/$AWE_KEY?detail=dataonly" \
            -o data/awe/awe.csv
          echo "AWE CSV rows: $(wc -l < data/awe/awe.csv)"

      - name: Fetch AWE JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$AWE_DATAFLOW/$AWE_KEY?detail=full" \
            -o data/awe/awe.json
          echo "AWE JSON: $(wc -c < data/awe/awe.json) bytes"

      - name: Fetch LCI CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$LCI_DATAFLOW/$LCI_KEY?detail=dataonly" \
            -o data/lci/lci.csv
          echo "LCI CSV rows: $(wc -l < data/lci/lci.csv)"

      - name: Fetch LCI JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$LCI_DATAFLOW/$LCI_KEY?detail=full" \
            -o data/lci/lci.json
          echo "LCI JSON: $(wc -c < data/lci/lci.json) bytes"

      - name: Fetch LCIgroups CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$LCIGROUPS_DATAFLOW/$LCIGROUPS_KEY?detail=dataonly" \
            -o data/lcigroups/lcigroups.csv
          echo "LCIgroups CSV rows: $(wc -l < data/lcigroups/lcigroups.csv)"

      - name: Fetch LCIgroups JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$LCIGROUPS_DATAFLOW/$LCIGROUPS_KEY?detail=full" \
            -o data/lcigroups/lcigroups.json
          echo "LCIgroups JSON: $(wc -c < data/lcigroups/lcigroups.json) bytes"

      - name: Fetch WPI CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$WPI_DATAFLOW/$WPI_KEY?detail=dataonly" \
            -o data/wpi/wpi.csv
          echo "WPI CSV rows: $(wc -l < data/wpi/wpi.csv)"

      - name: Fetch WPI JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$WPI_DATAFLOW/$WPI_KEY?detail=full" \
            -o data/wpi/wpi.json
          echo "WPI JSON: $(wc -c < data/wpi/wpi.json) bytes"

      - name: Fetch Population CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$POPULATION_DATAFLOW/$POPULATION_KEY?detail=dataonly" \
            -o data/population/population.csv
          echo "Population CSV rows: $(wc -l < data/population/population.csv)"

      - name: Fetch Population JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$POPULATION_DATAFLOW/$POPULATION_KEY?detail=full" \
            -o data/population/population.json
          echo "Population JSON: $(wc -c < data/population/population.json) bytes"

      - name: Fetch GDP CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$GDP_DATAFLOW/$GDP_KEY?detail=dataonly" \
            -o data/gdp/gdp.csv
          echo "GDP CSV rows: $(wc -l < data/gdp/gdp.csv)"

      - name: Fetch GDP JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$GDP_DATAFLOW/$GDP_KEY?detail=full" \
            -o data/gdp/gdp.json
          echo "GDP JSON: $(wc -c < data/gdp/gdp.json) bytes"

      - name: Fetch Households CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$HOUSEHOLDS_DATAFLOW/$HOUSEHOLDS_KEY?detail=dataonly" \
            -o data/households/households.csv
          echo "Households CSV rows: $(wc -l < data/households/households.csv)"

      - name: Fetch Households JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$HOUSEHOLDS_DATAFLOW/$HOUSEHOLDS_KEY?detail=full" \
            -o data/households/households.json
          echo "Households JSON: $(wc -c < data/households/households.json) bytes"

      - name: Fetch Building Activity CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$BUILDING_ACTIVITY_DATAFLOW/$BUILDING_ACTIVITY_KEY?detail=dataonly" \
            -o data/building_activity/building_activity.csv
          echo "Building Activity CSV rows: $(wc -l < data/building_activity/building_activity.csv)"

      - name: Fetch Building Activity JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$BUILDING_ACTIVITY_DATAFLOW/$BUILDING_ACTIVITY_KEY?detail=full" \
            -o data/building_activity/building_activity.json
          echo "Building Activity JSON: $(wc -c < data/building_activity/building_activity.json) bytes"

      - name: Fetch Housing Lending CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$LENDING_HOUSING_DATAFLOW/$LENDING_HOUSING_KEY?detail=dataonly" \
            -o data/lending_housing/lending_housing.csv
          echo "Housing Lending CSV rows: $(wc -l < data/lending_housing/lending_housing.csv)"

      - name: Fetch Housing Lending JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$LENDING_HOUSING_DATAFLOW/$LENDING_HOUSING_KEY?detail=full" \
            -o data/lending_housing/lending_housing.json
          echo "Housing Lending JSON: $(wc -c < data/lending_housing/lending_housing.json) bytes"

      - name: Fetch Labour Account CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$LABOUR_ACCOUNT_DATAFLOW/$LABOUR_ACCOUNT_KEY?detail=dataonly" \
            -o data/labour_account/labour_account.csv
          echo "Labour Account CSV rows: $(wc -l < data/labour_account/labour_account.csv)"

      - name: Fetch Labour Account JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$LABOUR_ACCOUNT_DATAFLOW/$LABOUR_ACCOUNT_KEY?detail=full" \
            -o data/labour_account/labour_account.json
          echo "Labour Account JSON: $(wc -c < data/labour_account/labour_account.json) bytes"

      - name: Fetch Household Spending CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$HOUSEHOLD_SPENDING_DATAFLOW/$HOUSEHOLD_SPENDING_KEY?detail=dataonly" \
            -o data/household_spending/household_spending.csv
          echo "Household Spending CSV rows: $(wc -l < data/household_spending/household_spending.csv)"

      - name: Fetch Household Spending JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$HOUSEHOLD_SPENDING_DATAFLOW/$HOUSEHOLD_SPENDING_KEY?detail=full" \
            -o data/household_spending/household_spending.json
          echo "Household Spending JSON: $(wc -c < data/household_spending/household_spending.json) bytes"

      - name: Fetch Labour Force CSV
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+csv;version=1.0.0" \
            "$ABS_API/$LABOUR_FORCE_DATAFLOW/$LABOUR_FORCE_KEY?detail=dataonly" \
            -o data/labour_force/labour_force.csv
          echo "Labour Force CSV rows: $(wc -l < data/labour_force/labour_force.csv)"

      - name: Fetch Labour Force JSON
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 5 --max-time 60 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/vnd.sdmx.data+json;version=1.0" \
            "$ABS_API/$LABOUR_FORCE_DATAFLOW/$LABOUR_FORCE_KEY?detail=full" \
            -o data/labour_force/labour_force.json
          echo "Labour Force JSON: $(wc -c < data/labour_force/labour_force.json) bytes"

      - name: Validate downloads
        run: |
          for f in data/cpi/cpi.csv data/cpi/cpi.json \
                   data/cpigroups/cpigroups.csv data/cpigroups/cpigroups.json \
                   data/cpihousing/cpihousing.csv data/cpihousing/cpihousing.json \
                   data/awe/awe.csv data/awe/awe.json \
                   data/lci/lci.csv data/lci/lci.json \
                   data/lcigroups/lcigroups.csv data/lcigroups/lcigroups.json \
                   data/wpi/wpi.csv data/wpi/wpi.json \
                   data/population/population.csv data/population/population.json \
                   data/gdp/gdp.csv data/gdp/gdp.json \
                   data/households/households.csv data/households/households.json \
                   data/building_activity/building_activity.csv data/building_activity/building_activity.json \
                   data/lending_housing/lending_housing.csv data/lending_housing/lending_housing.json \
                   data/labour_account/labour_account.csv data/labour_account/labour_account.json \
                   data/household_spending/household_spending.csv data/household_spending/household_spending.json \
                   data/labour_force/labour_force.csv data/labour_force/labour_force.json; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing"
              exit 1
            fi
            echo "OK: $f ($(wc -c < $f) bytes)"
          done

      - name: Write fetch metadata
        run: |
          echo '{"fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","sources":{}}' > data/cpi/cpi.meta.json
          echo '{"dataflow":"ABS,CPI","key":"1.10001.10.50.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/cpigroups/cpigroups.meta.json
          echo '{"dataflow":"ABS,CPI","key":"1.20003+30014+40053+40055+97558+97559+97560+115524.10.50.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/cpihousing/cpihousing.meta.json
          echo '{"dataflow":"ABS,AWE","key":"3.1.3.7.TOT.10.AUS.S","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/awe/awe.meta.json
          echo '{"dataflow":"ABS,LCI","key":"1.10001.P1.50.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/lci/lci.meta.json
          echo '{"dataflow":"ABS,LCI","key":"1.10001+20001+20002+20003+20004+20005+20006+115486+115488+115489+115493+126670+131278+131279.P1.50.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/lcigroups/lcigroups.meta.json
          echo '{"dataflow":"ABS,WPI","key":"1.THRPEB.7.TOT.20.AUS.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/wpi/wpi.meta.json
          echo '{"dataflow":"ABS,ERP_COMP_Q","key":"10.AUS.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/population/population.meta.json
          echo '{"dataflow":"ABS,ANA_AGG","key":"M1.GPM.20.AUS.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/gdp/gdp.meta.json
          echo '{"dataflow":"ABS,ABS_HH_PROV","key":"0.4.1.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/households/households.meta.json
          echo '{"dataflow":"ABS,BUILDING_ACTIVITY","key":"M6.AUS.CUR.TOT.9.100.20.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/building_activity/building_activity.meta.json
          echo '{"dataflow":"ABS,LEND_HOUSING","key":"FIN_NUM.NEWCOMMITS.DV8575.TOTLOANPURP.TOT.TOT.20.AUS.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/lending_housing/lending_housing.meta.json
          echo '{"dataflow":"ABS,LABOUR_ACCT_Q","key":"20.Q.TOTAL.TOTAL.AUS","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/labour_account/labour_account.meta.json
          echo '{"dataflow":"ABS,HSI_Q","key":"4.TOT.CVM.20.AUS.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/household_spending/household_spending.meta.json
          echo '{"dataflow":"ABS,LF","key":"M9.3.1599.20.AUS.Q","fetchedAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > data/labour_force/labour_force.meta.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/x-byrne/kilo.git
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected — ABS has not updated since last run."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "data: ABS snapshot ${TIMESTAMP}

          Updated files:
          $(git diff --staged --name-only)"
            git push
          fi

      - name: Purge CDN cache
        run: |
          for dataset in cpi cpigroups cpihousing awe lci lcigroups wpi population gdp households building_activity lending_housing labour_account household_spending labour_force; do
            curl -s -o /dev/null -w "%{http_code}" "https://purge.jsdelivr.net/gh/x-byrne/kilo@main/data/${dataset}/${dataset}.csv" || true
          done
