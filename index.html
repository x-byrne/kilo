<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABSVis — Australian Bureau of Statistics Visualisation Framework</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf9f6;
      --ink: #1a1a1a;
      --muted: #6b6b6b;
      --gold: #c9a84c;
      --cream: #f5f1e8;
      --teal: #2a9d8f;
      --red: #e76f51;
      --blue: #264653;
      --border: #e0dcd3;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 8px;
      --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'DM Mono', monospace;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
    }
    #app { min-height: 100vh; }
    .app-header {
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .app-header h1 span { color: var(--gold); }
    .app-main { padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }
    .card h2 {
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .grid { display: grid; gap: 1.5rem; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 900px) {
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .app-header, .app-main { padding-left: 1rem; padding-right: 1rem; }
    }
    button, select, input[type="text"] {
      font-family: var(--font);
      font-size: 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.5rem 0.75rem;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover, select:hover { border-color: var(--gold); }
    button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    button.primary:hover { background: var(--blue); }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .tag button {
      background: none;
      border: none;
      padding: 0;
      font-size: 1rem;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
    }
    .tag button:hover { color: var(--red); }
    .range-slider { position: relative; height: 40px; }
    .range-slider input[type="range"] {
      position: absolute;
      width: 100%;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: transparent;
      outline: none;
    }
    .range-slider input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--ink);
      border: 2px solid #fff;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .range-slider .track {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      width: 100%;
    }
    .range-slider .track-fill {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 6px;
      background: var(--gold);
      border-radius: 3px;
    }
    .chart-container { position: relative; height: 400px; }
    .stat-card {
      text-align: center;
      padding: 1rem;
    }
    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      font-family: var(--mono);
    }
    .stat-card .label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.25rem;
    }
    .stat-card .change {
      font-size: 0.8rem;
      font-family: var(--mono);
      margin-top: 0.25rem;
    }
    .positive { color: var(--teal); }
    .negative { color: var(--red); }
    .preset-nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .preset-nav button {
      font-weight: 500;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
